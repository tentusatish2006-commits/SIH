<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoute - Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- CDNs -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>

    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: #030810;
        }

        #bg-map {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            filter: brightness(0.4) contrast(1.2);
        }

        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            background-image: radial-gradient(circle, rgba(0,212,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: particleMove 20s linear infinite;
        }

        @keyframes particleMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        .login-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 450px;
            padding: 40px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUpFade 0.8s ease-out;
            background: rgba(3, 8, 16, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.18);
        }

        #logo-3d-wrap {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 12px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #logo-3d-wrap:active {
            cursor: grabbing;
        }
        #logo-3d {
            width: 140px;
            height: 140px;
        }
        .logo-hint-badge {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #00d4ff;
            background: rgba(3,8,16,0.92);
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid rgba(0,212,255,0.4);
            white-space: nowrap;
            pointer-events: none;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0,212,255,0.3);
        }

        h2 {
            margin: 0;
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #8fa3b0;
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .role-selector {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 25px;
        }

        .role-card {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(100,200,255,0.1);
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .role-card:hover {
            transform: translateY(-4px);
            border-color: #00d4ff;
            box-shadow: 0 4px 15px rgba(0,212,255,0.2);
        }

        .role-card.active {
            background: rgba(0,212,255,0.1);
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
        }

        .role-icon { font-size: 1.5rem; margin-bottom: 5px; }
        .role-title { font-size: 0.8rem; font-weight: 600; color: #fff; }
        .role-desc { font-size: 0.65rem; color: #8fa3b0; margin-top: 5px; }

        .form-group {
            width: 100%;
            margin-bottom: 20px;
        }

        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(100,200,255,0.2);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-control:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0,212,255,0.2);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00d4ff, #00aaff);
            border: none;
            border-radius: 8px;
            color: #030810;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.4);
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3,8,16,0.9);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .spinner-3d {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(0,212,255,0.1);
            border-left-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 20px;
            color: #00d4ff;
            font-size: 1.2rem;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="bg-map"></div>
    <div class="particles"></div>
    
    <div class="login-wrapper">
        <div class="login-card">
            <div id="logo-3d-wrap" title="Click and drag to rotate 3D 'N' Emblem">
                <div id="logo-3d"></div>
                <div class="logo-hint-badge">⚡ Drag 3D "N"</div>
            </div>
            <h2>SMARTROUTE</h2>
            <div class="subtitle">North-Eastern Emergency Command Center</div>
            
            <div class="role-selector">
                <div class="role-card active" onclick="selectRole(this)">
                    <div class="role-icon">🔧</div>
                    <div class="role-title">ADMINISTRATOR</div>
                    <div class="role-desc">HQ Command & Control</div>
                </div>
                <div class="role-card" onclick="selectRole(this)">
                    <div class="role-icon">📍</div>
                    <div class="role-title">FIELD OFFICER</div>
                    <div class="role-desc">Field Convoy & Reports</div>
                </div>
                <div class="role-card" onclick="selectRole(this)">
                    <div class="role-icon">🏛</div>
                    <div class="role-title">LOCAL AUTHORITY</div>
                    <div class="role-desc">District Oversight</div>
                </div>
            </div>

            <div class="form-group">
                <input type="text" id="login-user" class="form-control" placeholder="Officer / Command ID" value="admin_cmd">
            </div>
            <div class="form-group">
                <input type="password" id="login-pass" class="form-control" placeholder="Security Passcode" value="••••••••">
            </div>
            
            <button class="btn-login" onclick="doLogin()">LOGIN TO COMMAND CENTER</button>

            <div style="margin-top: 22px; text-align: center; font-size: 0.9rem; color: #8fa3b0;">
                New field officer or regional authority?
                <a href="signup.html" style="color: #00d4ff; text-decoration: none; font-weight: 700; margin-left: 6px; border-bottom: 1px dashed rgba(0,212,255,0.5);">Register Account →</a>
            </div>
            <div style="margin-top: 14px; text-align: center;">
                <a href="index.html" style="color: #6a8ea8; font-size: 0.82rem; text-decoration: none; letter-spacing: 0.5px;">← Return to Main Gateway</a>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="spinner-3d"></div>
        <div class="loading-text">AUTHENTICATING CREDENTIALS...</div>
    </div>

    <script src="js/components.js"></script>
    <script src="js/map-engine.js"></script>
    <script src="js/charts.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.MapEngine) {
                MapEngine.initMap('bg-map', { layersControl: false });
                const map = MapEngine.map;
                if (map) {
                    map.setView([26.15, 92.80], 7);
                    map.dragging.disable();
                    map.scrollWheelZoom.disable();
                    map.touchZoom.disable();
                    map.doubleClickZoom.disable();
                    map.boxZoom.disable();
                    map.keyboard.disable();
                    if (map.tap) map.tap.disable();
                }
            } else {
                const map = L.map('bg-map', { zoomControl: false, scrollWheelZoom: false, dragging: false }).setView([26.15, 92.80], 7);
                L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                    attribution: '&copy; Google Maps Satellite'
                }).addTo(map);
            }

            initInteractive3DNLogo();
        });

        function selectRole(element) {
            document.querySelectorAll('.role-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            const role = element.querySelector('.role-title') ? element.querySelector('.role-title').innerText.trim() : 'ADMINISTRATOR';
            localStorage.setItem('sr_user_role', role);
        }

        function doLogin() {
            document.getElementById('loading').style.display = 'flex';
            const activeRole = document.querySelector('.role-card.active .role-title');
            const role = activeRole ? activeRole.innerText.trim() : 'COMMAND HQ';
            const user = document.getElementById('login-user') ? document.getElementById('login-user').value.trim() : 'admin_cmd';
            localStorage.setItem('sr_user_role', role);
            localStorage.setItem('sr_username', user || 'Officer In-Charge');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 700);
        }

        /* ============================================================
           INTERACTIVE 3D "N" EMBLEM (GLOWING & MOVABLE)
           ============================================================ */
        function initInteractive3DNLogo() {
            const container = document.getElementById('logo-3d');
            const wrap = document.getElementById('logo-3d-wrap') || container;
            if (!container || typeof THREE === 'undefined') return;

            const width = 140;
            const height = 140;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
            camera.position.set(0, 1.0, 13);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0x00d4ff, 0.9);
            scene.add(ambient);

            const topLight = new THREE.PointLight(0x00ffff, 2.5, 30);
            topLight.position.set(4, 7, 6);
            scene.add(topLight);

            const rimLight = new THREE.PointLight(0x00ff88, 1.8, 25);
            rimLight.position.set(-5, -4, 4);
            scene.add(rimLight);

            const rootGroup = new THREE.Group();
            scene.add(rootGroup);

            // 1. Extruded 3D "N" Shape
            const shape = new THREE.Shape();
            shape.moveTo(-2.2, -3.2);
            shape.lineTo(-2.2, 3.2);
            shape.lineTo(-0.8, 3.2);
            shape.lineTo(1.0, -0.6);
            shape.lineTo(1.0, 3.2);
            shape.lineTo(2.2, 3.2);
            shape.lineTo(2.2, -3.2);
            shape.lineTo(0.8, -3.2);
            shape.lineTo(-1.0, 0.6);
            shape.lineTo(-1.0, -3.2);
            shape.closePath();

            const extrudeSettings = {
                depth: 0.9,
                bevelEnabled: true,
                bevelSegments: 3,
                steps: 2,
                bevelSize: 0.15,
                bevelThickness: 0.15
            };
            const nGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            nGeo.center();

            const nMat = new THREE.MeshStandardMaterial({
                color: 0x051829,
                emissive: 0x002d4d,
                emissiveIntensity: 0.5,
                roughness: 0.18,
                metalness: 0.88,
            });
            const nMesh = new THREE.Mesh(nGeo, nMat);
            rootGroup.add(nMesh);

            // Glowing cyan wireframe edges
            const edgeMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.5 });
            const edgeGeo = new THREE.EdgesGeometry(nGeo, 24);
            const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
            nMesh.add(edgeLines);

            // 2. Traveling Glowing Energy Line along the perimeter
            const perimeterPoints = [
                new THREE.Vector3(-2.2, 3.2, 0.5),
                new THREE.Vector3(-0.8, 3.2, 0.5),
                new THREE.Vector3(1.0, -0.6, 0.5),
                new THREE.Vector3(1.0, 3.2, 0.5),
                new THREE.Vector3(2.2, 3.2, 0.5),
                new THREE.Vector3(2.2, -3.2, 0.5),
                new THREE.Vector3(0.8, -3.2, 0.5),
                new THREE.Vector3(-1.0, 0.6, 0.5),
                new THREE.Vector3(-1.0, -3.2, 0.5),
                new THREE.Vector3(-2.2, -3.2, 0.5),
                new THREE.Vector3(-2.2, 3.2, 0.5),
            ];
            const energyCurve = new THREE.CatmullRomCurve3(perimeterPoints, true);
            const energyTubeGeo = new THREE.TubeGeometry(energyCurve, 60, 0.08, 6, true);
            const energyTubeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.75 });
            const energyTube = new THREE.Mesh(energyTubeGeo, energyTubeMat);
            nMesh.add(energyTube);

            // Luminous traveling bead
            const beadGeo = new THREE.SphereGeometry(0.24, 16, 16);
            const beadMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const energyBead = new THREE.Mesh(beadGeo, beadMat);
            nMesh.add(energyBead);

            const beadLight = new THREE.PointLight(0x00ffff, 2.0, 7);
            energyBead.add(beadLight);

            // Platform Rim Ring
            const ringGeo = new THREE.RingGeometry(3.6, 3.9, 32);
            ringGeo.rotateX(-Math.PI / 2);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, side: THREE.DoubleSide });
            const platformRim = new THREE.Mesh(ringGeo, ringMat);
            platformRim.position.y = -3.4;
            rootGroup.add(platformRim);

            // Floating Reactive Spatial Particles
            const particleCount = 45;
            const particleGeo = new THREE.BufferGeometry();
            const particlePos = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i += 3) {
                particlePos[i] = (Math.random() - 0.5) * 8;
                particlePos[i+1] = (Math.random() - 0.5) * 7;
                particlePos[i+2] = (Math.random() - 0.5) * 7;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
            const particleMat = new THREE.PointsMaterial({
                color: 0x00d4ff,
                size: 0.18,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
            });
            const particleField = new THREE.Points(particleGeo, particleMat);
            rootGroup.add(particleField);

            // Interactive Drag-to-Rotate Physics
            let isPointerDown = false;
            let lastMouseX = 0;
            let lastMouseY = 0;
            let velocityX = 0;
            let velocityY = 0;
            let rotVelocity = 0;
            let targetRotY = 0.4;
            let targetRotX = 0.15;

            const targetDom = wrap || renderer.domElement;

            targetDom.addEventListener('mousedown', (e) => {
                isPointerDown = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isPointerDown) return;
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;

                velocityX = dx * 0.015;
                velocityY = dy * 0.012;
                rotVelocity = Math.hypot(dx, dy) * 0.05;

                targetRotY += velocityX;
                targetRotX += velocityY;
                targetRotX = THREE.MathUtils.clamp(targetRotX, -0.6, 0.6);
            });

            window.addEventListener('mouseup', () => { isPointerDown = false; });

            // Touch Drag Support
            targetDom.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isPointerDown = true;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            });
            window.addEventListener('touchmove', (e) => {
                if (!isPointerDown || e.touches.length !== 1) return;
                const dx = e.touches[0].clientX - lastMouseX;
                const dy = e.touches[0].clientY - lastMouseY;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;

                velocityX = dx * 0.015;
                velocityY = dy * 0.012;
                rotVelocity = Math.hypot(dx, dy) * 0.06;

                targetRotY += velocityX;
                targetRotX += velocityY;
            });
            window.addEventListener('touchend', () => { isPointerDown = false; });

            // Animation Loop
            let clock = new THREE.Clock();
            let pulseTimer = 0;
            let travelProgress = 0;

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();

                if (!isPointerDown) {
                    targetRotY += 0.009; // Smooth continuous idle rotation
                    rotVelocity *= 0.93;
                }

                rootGroup.rotation.y += (targetRotY - rootGroup.rotation.y) * 0.15;
                rootGroup.rotation.x += (targetRotX - rootGroup.rotation.x) * 0.15;

                // Travel energy bead along N perimeter
                travelProgress = (travelProgress + delta * 0.35) % 1.0;
                const beadPos = energyCurve.getPointAt(travelProgress);
                energyBead.position.copy(beadPos);

                // Periodic energy surge every 8-10 seconds
                pulseTimer += delta;
                let surgeIntensity = 0;
                if (pulseTimer > 8.0) {
                    surgeIntensity = Math.sin((pulseTimer - 8.0) * Math.PI / 1.5);
                    if (pulseTimer > 9.5) pulseTimer = 0;
                }

                const baseGlow = 0.5;
                const velocityGlow = Math.min(rotVelocity * 1.8, 2.5);
                const currentGlow = baseGlow + velocityGlow + Math.max(0, surgeIntensity * 2.0);

                nMat.emissiveIntensity = currentGlow;
                energyTubeMat.opacity = Math.min(1.0, 0.65 + velocityGlow * 0.4 + surgeIntensity * 0.35);
                beadLight.intensity = 1.8 + velocityGlow * 2.5 + surgeIntensity * 2.5;

                // Reactive particles swirl
                const pAttr = particleGeo.attributes.position;
                const speedMult = 1 + rotVelocity * 2.0;
                for (let i = 0; i < particleCount; i++) {
                    const py = pAttr.getY(i) + delta * 0.4 * speedMult;
                    pAttr.setY(i, py > 3.5 ? -3.5 : py);
                }
                pAttr.needsUpdate = true;
                particleField.rotation.y += delta * 0.12 * speedMult;

                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
